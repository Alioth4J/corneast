name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: ./mvnw clean test -B -ntp
      - name: Upload JaCoCo exec files
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-exec
          path: |
            corneast-core/target/jacoco.exec
            corneast-client/target/jacoco.exec

  report:
    name: JaCoCo Report
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Download JaCoCo exec files
        uses: actions/download-artifact@v4
        with:
          name: jacoco-exec
      - name: Generate JaCoCo reports
        run: ./mvnw compile jacoco:report -pl corneast-core,corneast-client -am -B -ntp
      - name: Upload JaCoCo reports
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: |
            corneast-core/target/site/jacoco/
            corneast-client/target/site/jacoco/

  verify:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - uses: docker/setup-buildx-action@v2
      - run: ./mvnw clean -DskipTests=true verify -B -ntp